<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobil/tablette tam ekran ve doğru ölçekleme için viewport ayarı.
         user-scalable=no: Çocuklar yanlışlıkla iki parmakla zoom yapmasın. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe9f0" />
    <title>İnteraktif Kitap — Sevgi</title>

    <!-- Çocuk dostu, yuvarlak hatlı fontlar (Türkçe karakter destekli):
         "Baloo 2"  -> başlıklar ve butonlar
         "Quicksand" -> normal metinler -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React uygulaması bu div'in içine yerleşir (bkz. src/main.jsx) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
